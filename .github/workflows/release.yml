name: Release installer

# Builds the Windows installer on GitHub's own Windows machine and attaches it to a DRAFT
# release. Nothing reaches players until you open the draft and press "Publish release".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ]; then
            echo "Tag $GITHUB_REF does not match package.json version v$VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm test
